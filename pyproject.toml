[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wayparam"
version = "0.4.0"
description = "Fetch and normalize parameterized URLs from the Internet Archive Wayback CDX API (OSINT-friendly)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0"}
authors = [{name = "Alessandro Greco"}]
keywords = ["osint", "wayback", "url", "parameters", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
  "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
wayparam = "wayparam.cli:main"
wayparam-gui = "wayparam.gui:main"

[project.urls]
Homepage = "https://aleff-github.github.io/wayparam/"
Repository = "https://github.com/aleff-github/wayparam"
Issues = "https://github.com/aleff-github/wayparam/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wayparam.gui" = ["*.html"]

[tool.mypy]
# The package supports 3.9, but mypy 1.x refuses to target anything below
# 3.10. Everything here uses `from __future__ import annotations`, and the CI
# test matrix is what actually proves the 3.9 floor.
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
