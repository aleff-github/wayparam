name: wayparam
title: wayparam
base: core22
adopt-info: wayparam
summary: Fetch and normalize parameterized URLs from the Wayback CDX API
description: |
  wayparam queries the Internet Archive Wayback Machine CDX API to retrieve
  historical URLs for a host (or a list of hosts), filters out common
  static/boring URLs, and outputs normalized URLs that contain query
  parameters.

  By default, query parameter values are replaced with a placeholder (FUZZ),
  making the output suitable for sharing and fuzzing workflows. The tool does
  not crawl targets: it only queries the public Wayback CDX API.

  Note on confinement: this snap is strictly confined. It can read/write only
  inside your home directory (and removable media, once connected), so run it
  from a directory under $HOME or pass -o/--outdir accordingly.

license: GPL-3.0-only
website: https://aleff-github.github.io/wayparam/
source-code: https://github.com/aleff-github/wayparam
issues: https://github.com/aleff-github/wayparam/issues
contact: https://github.com/aleff-github/wayparam/issues

grade: stable
confinement: strict

# Architectures are handled by the build service (Launchpad/Snap Store) or by
# `snapcraft remote-build`. Uncomment to pin them explicitly:
# architectures:
#   - build-on: amd64
#   - build-on: arm64

apps:
  wayparam:
    # TLS note: do NOT set SSL_CERT_FILE/SSL_CERT_DIR here. httpx reads those
    # variables directly (httpx/_config.py) and dies with FileNotFoundError if
    # they point at a missing file. Staging the ca-certificates deb does not
    # help: the bundle is generated by update-ca-certificates in the postinst,
    # which snapcraft never runs. httpx pulls certifi and uses its bundled
    # cacert.pem, which ships inside the snap, so TLS works out of the box.
    command: bin/wayparam
    plugs:
      - network
      - home
      - removable-media

parts:
  wayparam:
    plugin: python
    source: .
    build-packages:
      - python3-dev
    override-pull: |
      craftctl default
      # Keep the snap version in sync with pyproject.toml
      version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml | head -1)"
      craftctl set version="$version"
