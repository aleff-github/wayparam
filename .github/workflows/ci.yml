name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        run: mypy src/wayparam

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.9"; prove it on every one.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    name: Tests (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'
      - name: Tests
        run: pytest -q

  platform:
    name: Platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  package:
    name: Package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build Python artifacts
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*
          python -m pip install --force-reinstall dist/*.whl
          wayparam --version
          wayparam-gui --version
      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dh-python python3-all \
            python3-setuptools pybuild-plugin-pyproject python3-httpx python3-pytest lintian
      - name: Build and lint Debian packages
        run: |
          ./scripts/build-deb.sh
          lintian --tag-display-limit 0 ../wayparam_*.changes
      - name: Smoke test Debian packages
        run: |
          sudo apt-get install -y ../wayparam_*_all.deb ../wayparam-gui_*_all.deb
          /usr/bin/wayparam --version
          /usr/bin/wayparam-gui --version
          dpkg -L wayparam | grep -q /usr/bin/wayparam
          dpkg -L wayparam-gui | grep -q /usr/bin/wayparam-gui
          dpkg -L wayparam-gui | grep -q 'gui/index.html'
          ! dpkg -L wayparam | grep -q 'gui/index.html'

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'
      - name: Tests with coverage
        # The floor only ratchets upwards; raise it when coverage improves.
        run: pytest -q --cov=wayparam --cov-report=term-missing --cov-fail-under=88
