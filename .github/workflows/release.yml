name: Release

# Publishes wayparam on a tag push (e.g. v0.3.1):
#   * PyPI            -> pip / pipx install wayparam
#   * Snap Store      -> snap install wayparam
#   * GitHub Release  -> .deb asset (apt install ./wayparam_*.deb)
#
# Required one-time setup:
#   * PyPI: the project already exists, so add the Trusted Publisher from
#     "Manage project -> Publishing" (owner aleff-github, repo wayparam,
#     workflow release.yml, environment pypi). No token needed. If you would
#     rather keep uploading with twine by hand, just delete the "pypi" job
#     below - the snap and deb jobs are independent.
#   * Snap: `snapcraft register wayparam`, then
#     `snapcraft export-login --snaps wayparam --acls package_access,package_push,package_update,package_release -`
#     and store the output as the SNAPCRAFT_STORE_CREDENTIALS repo secret.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Only a tag publishes. A manual dispatch is for validating the build,
    # and must never push a release to PyPI as a side effect.
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -U build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run of an already-published tag should be a no-op, not a hard
          # failure on the whole workflow.
          skip-existing: true

  snap:
    name: Build and publish snap
    runs-on: ubuntu-latest
    env:
      # Mirrored into the environment so the publish step can test for it:
      # `secrets` is not available in a step-level `if`.
      SNAP_CREDS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
      - name: Smoke test the snap
        run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          wayparam --help
      - uses: snapcore/action-publish@v1
        # Skip rather than fail when the store credentials are not set up yet;
        # the build and smoke test above still gate the tag.
        if: startsWith(github.ref, 'refs/tags/') && env.SNAP_CREDS != ''
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  deb:
    name: Build .deb
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the .deb to the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dh-python python3-all \
            python3-setuptools pybuild-plugin-pyproject python3-httpx python3-pytest lintian
      - name: Build package
        run: ./scripts/build-deb.sh
      - name: Lintian
        run: lintian --tag-display-limit 0 ../wayparam_*.changes || true
      - name: Smoke test
        run: |
          # Installs both binary packages: the CLI and the optional web UI.
          sudo apt-get install -y ../wayparam_*_all.deb ../wayparam-gui_*_all.deb
          wayparam --version
          man -w wayparam
          wayparam-gui --version
          # The split must be real: neither package may be empty, and the
          # page itself has to ship or the UI serves nothing.
          dpkg -L wayparam | grep -q /usr/bin/wayparam
          dpkg -L wayparam-gui | grep -q /usr/bin/wayparam-gui
          dpkg -L wayparam-gui | grep -q 'gui/index.html'
          ! dpkg -L wayparam | grep -q 'gui/index.html' 
          # The UI must come up and refuse an untokenised request.
          wayparam-gui --no-browser --port 8799 &
          for _ in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:8799/ && break; sleep 0.2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/)" = "403"
      - name: Collect artifacts into the workspace
        # dpkg-buildpackage writes to the parent directory, but
        # actions/upload-artifact rejects any path containing '..'.
        run: |
          mkdir -p dist-deb
          cp ../wayparam*_all.deb dist-deb/
      - uses: actions/upload-artifact@v4
        with:
          name: wayparam-deb
          path: dist-deb/*.deb
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushing a tag does not create a Release, and `upload` requires one.
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          gh release upload "${GITHUB_REF_NAME}" dist-deb/*.deb --clobber
